<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETFPro - Dashboard</title>
    <link rel="stylesheet" href="cartera.css">
</head>
<body>
    <div class="top-bar">

        <img src="../assets/logo.png" alt="Logo" class="logo-small">

        <div class="nav-buttons">
            <button class="nav-btn active">Cartera</button>
            <button class="nav-btn">Efectivo</button>
        </div>

        <input type="text" class="search" placeholder="Buscar ETFs">

        <input type="text" class="user-display" value="@usuario_actual" readonly>  
    </div>

    <div class="opciones de la cartera">
        
        <div class="cartera-opciones">
            <button class="opcion-btn">
                <i class="fa-solid fa-chart-pie"></i> Análisis de la cartera
            </button>
            <button class="opcion-btn">
                <i class="fa-solid fa-bullseye"></i> Plan de inversión
            </button>
        </div>

    </div>

    <!-- Añadir referencia al archivo script.js -->
    <script src="script.js"></script>
</body>
</html>
