<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Invertir en ETFs</title>
    <link rel="stylesheet" href="invertir_etfs.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="top-bar">
      <img src="../assets/logo.png" alt="Logo" class="logo-small" />
      <div class="nav-buttons">
        <a href="cartera.html" class="nav-btn">
          <i class="fa-solid fa-wallet"></i> Cartera
        </a>
        <a href="efectivo.html" class="nav-btn">
          <i class="fa-solid fa-money-bill-wave"></i> Efectivo
        </a>
      </div>
      <input
        type="text"
        class="user-display"
        value="@usuario_actual"
        readonly
      />
    </div>

    <div class="contenido-principal">
      <h1>Inversiones Disponibles</h1>

      <div class="layout">
        <!-- Tabla de ETFs -->
        <table class="tabla-etfs">
          <thead>
            <tr>
              <th>Símbolo</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Volumen</th>
            </tr>
          </thead>
          <tbody id="tabla-etfs-body">
            <tr>
              <td colspan="4" class="cargando">Cargando ETFs disponibles...</td>
            </tr>
          </tbody>
        </table>


      <div class="formulario">
        <h2>Formulario de Inversión</h2>
      
        <label for="etf">ETF Seleccionado:</label>
        <select id="etf">
          <option value="" disabled selected>-- Selecciona un ETF --</option>
          <!-- Las opciones se cargarán dinámicamente desde la API -->
        </select>
      
        <p><strong>Precio por unidad:</strong> $<span id="precio">---</span></p>
      
        <label for="monto">Monto a Invertir ($):</label>
        <input type="number" id="monto" min="0" step="0.01">
      
        <p><strong>Cantidad de ETFs:</strong> <span id="cantidad">---</span></p>
        <p><strong>Saldo Disponible:</strong> $<span id="saldo">0.00</span></p>
      
        <div class="acciones">
          <button class="cancelar-btn" onclick="window.location.href='cartera.html'">
            <i class="fa-solid fa-xmark"></i> Cancelar
          </button>          
          
          <button class="confirmar" id="confirmarInversion">
            <i class="fa-solid fa-circle-check"></i> Confirmar Inversión
          </button>
        </div>

        <div id="status-mensaje" class="mensaje-status"></div>
      </div>
    </div>
    
    <!-- Script específico para la página de inversión -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        // Cargar el saldo actual del usuario
        let saldoActual = parseFloat(localStorage.getItem("saldoDisponible")) || 0;
        document.getElementById("saldo").textContent = saldoActual.toFixed(2);
        
        // Obtener el nombre de usuario actual
        const usuarioActual = localStorage.getItem("currentUser");
        document.querySelector(".user-display").value = usuarioActual ? "@" + usuarioActual : "@usuario";
        
        // Función para cargar los ETFs desde la API
        async function cargarEtfs() {
          try {
            const response = await fetch('http://localhost:5000/api/etfs');
            if (!response.ok) {
              throw new Error('Error al obtener los ETFs');
            }
            
            const data = await response.json();
            const etfs = data.etfs;
            
            if (etfs && etfs.length > 0) {
              // Llenar la tabla con los datos
              const tablaBody = document.getElementById('tabla-etfs-body');
              tablaBody.innerHTML = '';
              
              // Llenar el desplegable de ETFs
              const selectEtf = document.getElementById('etf');
              selectEtf.innerHTML = '<option value="" disabled selected>-- Selecciona un ETF --</option>';
              
              etfs.forEach(etf => {
                if (etf.current_price) {
                  // Añadir fila a la tabla
                  const tr = document.createElement('tr');
                  tr.innerHTML = `
                    <td>${etf.symbol}</td>
                    <td>${etf.name}</td>
                    <td>$${etf.current_price ? etf.current_price.toFixed(2) : 'N/A'}</td>
                    <td>${etf.current_volume ? etf.current_volume.toLocaleString() : 'N/A'}</td>
                  `;
                  tablaBody.appendChild(tr);
                  
                  // Añadir opción al desplegable
                  const option = document.createElement('option');
                  option.value = JSON.stringify({
                    symbol: etf.symbol,
                    price: etf.current_price
                  });
                  option.textContent = `${etf.symbol} - ${etf.name}`;
                  selectEtf.appendChild(option);
                }
              });
            } else {
              document.getElementById('tabla-etfs-body').innerHTML = 
                '<tr><td colspan="4">No hay ETFs disponibles</td></tr>';
            }
          } catch (error) {
            console.error('Error:', error);
            document.getElementById('tabla-etfs-body').innerHTML = 
              '<tr><td colspan="4">Error al cargar los ETFs</td></tr>';
          }
        }
        
        // Cargar ETFs al iniciar
        cargarEtfs();
        
        // Evento para cuando se selecciona un ETF
        const etfSelect = document.getElementById('etf');
        etfSelect.addEventListener('change', function() {
          const selectedOption = JSON.parse(this.value);
          document.getElementById('precio').textContent = selectedOption.price.toFixed(2);
          calcularCantidad();
        });
        
        // Evento para cuando se ingresa un monto
        const montoInput = document.getElementById('monto');
        montoInput.addEventListener('input', calcularCantidad);
        
        // Función para calcular la cantidad de ETFs
        function calcularCantidad() {
          const monto = parseFloat(montoInput.value) || 0;
          const etfData = etfSelect.value ? JSON.parse(etfSelect.value) : null;
          
          if (etfData && etfData.price) {
            const cantidad = monto / etfData.price;
            document.getElementById('cantidad').textContent = cantidad.toFixed(6);
          } else {
            document.getElementById('cantidad').textContent = '---';
          }
        }
        
        // Mostrar mensaje de estado
        function mostrarMensaje(mensaje, esError = false) {
          const statusMsg = document.getElementById('status-mensaje');
          statusMsg.textContent = mensaje;
          statusMsg.className = esError ? 'mensaje-status error' : 'mensaje-status exito';
          statusMsg.style.display = 'block';
          
          // Ocultar después de 5 segundos
          setTimeout(() => {
            statusMsg.style.display = 'none';
          }, 5000);
        }
        
        // Evento para confirmar la inversión
        document.getElementById('confirmarInversion').addEventListener('click', async function() {
          const monto = parseFloat(montoInput.value) || 0;
          const etfData = etfSelect.value ? JSON.parse(etfSelect.value) : null;
          const usuario = localStorage.getItem("currentUser");
          
          if (!usuario) {
            mostrarMensaje('Debes iniciar sesión para realizar inversiones', true);
            return;
          }
          
          if (!etfData) {
            mostrarMensaje('Por favor, selecciona un ETF', true);
            return;
          }
          
          if (monto <= 0) {
            mostrarMensaje('Por favor, ingresa un monto válido', true);
            return;
          }
          
          if (monto > saldoActual) {
            mostrarMensaje('Saldo insuficiente para realizar esta inversión', true);
            return;
          }
          
          const cantidad = monto / etfData.price;
          
          try {
            // Registrar la compra en la base de datos
            const response = await fetch('http://localhost:5000/api/comprar-etf', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                username: usuario,
                simbolo: etfData.symbol,
                monto: monto,
                cantidad: cantidad,
                precio: etfData.price
              })
            });
            
            if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.error || 'Error al registrar la compra');
            }
            
            const responseData = await response.json();
            
            // Actualizar el saldo local
            const nuevoSaldo = saldoActual - monto;
            localStorage.setItem('saldoDisponible', nuevoSaldo.toFixed(2));
            
            mostrarMensaje(`Inversión realizada con éxito: Has comprado ${cantidad.toFixed(6)} unidades de ${etfData.symbol}`);
            
            // Redirigir después de un breve tiempo
            setTimeout(() => {
              window.location.href = 'cartera.html';
            }, 2000);
            
          } catch (error) {
            console.error('Error:', error);
            mostrarMensaje(`Error: ${error.message}`, true);
          }
        });
      });
    </script>
    
    <style>
      .mensaje-status {
        margin-top: 20px;
        padding: 10px;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
        display: none;
      }
      
      .mensaje-status.exito {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      
      .mensaje-status.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
    
    <script src="script.js"></script>
  </body>
</html>
