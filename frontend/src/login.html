<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETFPro - Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
      <img src="..\assets\logo.png" alt="ETFPro" class="logo" />
      <h1>ETFPro</h1>

      <label for="username">Nombre de usuario</label>
      <input
        type="text"
        id="username"
        class="input"
        placeholder="Ingrese su usuario"
      />

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        class="input"
        placeholder="Ingrese su contraseña"
      />

      <!-- Contenedor de botones con "Iniciar Sesión" arriba de "Registrarme" -->
      <div class="buttons">
        <button class="btn" id="loginButton">Iniciar Sesión</button>
        <button class="btn" id="registroButton">Registrarme</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
